<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: mewe-img: https://*.giphy.com; media-src mewe-img:; font-src 'self'"
    />
    <title>Goonie Mewe Viewer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside id="accounts" class="accounts" aria-label="Cuentas">
      <ul id="account-list" class="account-list"></ul>
      <button id="add-account" class="account-btn add" title="Agregar cuenta" aria-label="Agregar cuenta">+</button>
    </aside>

    <main class="main">
      <header class="app-header">
        <div class="header-start">
          <!-- foto de la cuenta activa: abre su perfil (app.js pone la foto y el nombre en el title) -->
          <button id="app-title" class="profile-btn" title="Ver mi perfil" aria-label="Ver mi perfil" hidden></button>
        </div>
        <nav id="view-tabs" class="header-tabs" aria-label="Sección" hidden>
          <button data-view="feed" class="btn icon-btn" title="Feed (Ctrl+1)" aria-label="Feed">
            <span class="icon icon-newspaper" aria-hidden="true"></span>
          </button>
          <button data-view="chat" class="btn icon-btn" title="Chats (Ctrl+2)" aria-label="Chats">
            <span class="icon icon-message-circle" aria-hidden="true"></span>
          </button>
          <button data-view="lists" class="btn icon-btn" title="Listas: grupos y personas (Ctrl+3)" aria-label="Listas">
            <span class="icon icon-users" aria-hidden="true"></span>
          </button>
          <button data-view="stories" class="btn icon-btn" title="Historias (Ctrl+4)" aria-label="Historias">
            <span class="icon icon-circle-dashed" aria-hidden="true"></span>
          </button>
        </nav>
        <div class="header-actions">
          <button id="open-search" class="btn icon-btn" title="Buscar personas" aria-label="Buscar personas" hidden>
            <span class="icon icon-search" aria-hidden="true"></span>
          </button>
          <button id="open-notifications" class="btn icon-btn has-badge" title="Notificaciones" aria-label="Notificaciones" hidden>
            <span class="icon icon-bell" aria-hidden="true"></span><span id="notif-badge" class="count-badge" hidden></span>
          </button>
          <button id="open-options" class="btn icon-btn" title="Opciones" aria-label="Opciones" aria-haspopup="menu">
            <span class="icon icon-ellipsis-vertical" aria-hidden="true"></span>
          </button>
        </div>
      </header>
      <!-- segundo panel: controles propios de la vista activa (izquierda / centro / derecha) y Actualizar -->
      <div id="view-toolbar" class="view-toolbar" hidden>
        <div id="toolbar-left" class="toolbar-zone left"></div>
        <div id="toolbar-center" class="toolbar-zone center"></div>
        <div class="toolbar-zone right">
          <div id="toolbar-right" class="toolbar-slot"></div>
          <button id="refresh-view" class="btn icon-btn" title="Actualizar (F5)" aria-label="Actualizar" hidden>
            <span class="icon icon-refresh-cw" aria-hidden="true"></span>
          </button>
        </div>
      </div>
      <div id="app-error" role="alert"></div>

      <!-- las vistas (feed, chats, …) crean su DOM acá: ver router.js -->
      <div id="view-host" class="view-host"></div>
    </main>

    <dialog id="login-modal" class="modal">
      <form id="login-form" method="dialog">
        <h2>Agregar cuenta de MeWe</h2>
        <label>
          Email o teléfono
          <input name="email" type="text" autocomplete="username" required />
        </label>
        <label>
          Contraseña
          <input name="password" type="password" autocomplete="current-password" />
        </label>
        <p id="login-status" class="status"></p>
        <div id="login-error"></div>
        <div class="modal-actions">
          <button type="button" id="login-cancel" class="btn">Cancelar</button>
          <button type="submit" id="login-submit" class="btn primary">Iniciar sesión</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
