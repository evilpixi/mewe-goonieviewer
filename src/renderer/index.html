<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: mewe-img:; font-src 'self'"
    />
    <title>MeWe Viewer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside id="accounts" class="accounts" aria-label="Cuentas">
      <ul id="account-list" class="account-list"></ul>
      <button id="add-account" class="account-btn add" title="Agregar cuenta" aria-label="Agregar cuenta">+</button>
    </aside>

    <main class="main">
      <header class="app-header">
        <button id="nav-back" class="btn" title="Volver (Alt+←)" aria-label="Volver" hidden>←</button>
        <h1><button id="app-title" class="link-btn user-name" title="Ver mi perfil" disabled>Sin cuenta seleccionada</button></h1>
        <nav id="view-tabs" class="segmented" aria-label="Sección" hidden>
          <button data-view="feed" title="Feed (Ctrl+1)">Feed</button>
          <button data-view="chat" title="Chats (Ctrl+2)">Chats</button>
          <button data-view="groups" title="Grupos (Ctrl+3)">Grupos</button>
        </nav>
        <!-- controles propios de la vista activa (ej. filtro del feed) -->
        <div id="view-toolbar" class="view-toolbar"></div>
        <div class="header-actions">
          <button id="open-notifications" class="btn icon-btn has-badge" title="Notificaciones" aria-label="Notificaciones" hidden>
            <span aria-hidden="true">🔔</span><span id="notif-badge" class="count-badge" hidden></span>
          </button>
          <button id="refresh-view" class="btn icon-btn" title="Actualizar (F5)" aria-label="Actualizar" hidden>⟳</button>
          <button id="open-settings" class="btn icon-btn" title="Ajustes de la interfaz" aria-label="Ajustes de la interfaz">⚙</button>
          <button id="relogin-account" class="btn" hidden>Reconectar</button>
          <button id="remove-account" class="btn danger" hidden>Quitar</button>
        </div>
      </header>
      <div id="app-error" role="alert"></div>

      <!-- las vistas (feed, chats, …) crean su DOM acá: ver router.js -->
      <div id="view-host" class="view-host"></div>
    </main>

    <dialog id="login-modal" class="modal">
      <form id="login-form" method="dialog">
        <h2>Agregar cuenta de MeWe</h2>
        <label>
          Email o teléfono
          <input name="email" type="text" autocomplete="username" required />
        </label>
        <label>
          Contraseña
          <input name="password" type="password" autocomplete="current-password" />
        </label>
        <p id="login-status" class="status"></p>
        <div id="login-error"></div>
        <div class="modal-actions">
          <button type="button" id="login-cancel" class="btn">Cancelar</button>
          <button type="submit" id="login-submit" class="btn primary">Iniciar sesión</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
